<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Valentine 💖</title>

  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --pink-1: #f8cdda;
      --pink-2: #fbd3e9;
      --accent-1: #ff758c;
      --accent-2: #ff7eb3;
      --text-dark: #333;
      --text-light: #555;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, var(--pink-1), var(--pink-2));
      font-family: "Poppins", sans-serif;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 25px;
      text-align: center;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
      animation: fadeIn 1.4s ease;
      position: relative;
    }

    .heart {
      font-size: 46px;
      margin-bottom: 10px;
      animation: heartbeat 2s infinite;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: 24px;
      margin: 10px 0;
      color: var(--text-dark);
    }

    p {
      font-size: 16px;
      color: var(--text-light);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .buttons {
      position: relative;
      height: 60px;
    }

    button {
      padding: 12px 28px;
      border-radius: 30px;
      border: none;
      font-size: 15px;
      cursor: pointer;
      font-family: "Poppins", sans-serif;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    #yesBtn {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: #fff;
      box-shadow: 0 10px 25px rgba(255, 120, 160, 0.4);
    }

    #yesBtn:hover {
      transform: scale(1.08);
    }

    #noBtn {
      background: #f1f1f1;
      color: #555;
      position: absolute;
      left: 55%;
    }

    .floating-heart {
      position: fixed;
      bottom: -20px;
      font-size: 18px;
      opacity: 0.6;
      animation: floatUp linear forwards;
      pointer-events: none;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatUp {
      from { transform: translateY(0); opacity: 0; }
      20% { opacity: 0.6; }
      to { transform: translateY(-120vh); opacity: 0; }
    }
  </style>
</head>

<body>

  <!-- Music -->
  <audio id="bgMusic" loop>
    <source
      src="https://www.bensound.com/bensound-music/bensound-love.mp3"
      type="audio/mpeg"
    />
  </audio>

  <main class="card" id="card">
    <div class="heart">💗</div>
    <h1>My Dearest <span id="name">Rupam</span></h1>
    <p>
      Every moment feels softer with you.<br />
      Will you be my Valentine?
    </p>

    <div class="buttons">
      <button id="yesBtn">Yes, always 💕</button>
      <button id="noBtn">No</button>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const noBtn = document.getElementById("noBtn");
      const yesBtn = document.getElementById("yesBtn");
      const card = document.getElementById("card");
      const music = document.getElementById("bgMusic");

      // Mobile-safe music start
      document.body.addEventListener(
        "click",
        () => {
          music.play().catch(() => {});
        },
        { once: true }
      );

      // No button escape
      noBtn.addEventListener("mouseenter", () => {
        const x = Math.random() * 120 - 60;
        const y = Math.random() * 40 - 20;
        noBtn.style.transform = `translate(${x}px, ${y}px)`;
      });

      // Yes button success
      yesBtn.addEventListener("click", () => {
        card.innerHTML = `
          <div class="heart">💖</div>
          <h1>You chose love</h1>
          <p>
            And I promise to choose you,<br />
            every single day.
          </p>
        `;
        spawnHearts(30);
      });

      function spawnHearts(count) {
        for (let i = 0; i < count; i++) {
          const heart = document.createElement("div");
          heart.className = "floating-heart";
          heart.textContent = "💗";
          heart.style.left = Math.random() * 100 + "vw";
          heart.style.animationDuration = 4 + Math.random() * 3 + "s";
          document.body.appendChild(heart);
          setTimeout(() => heart.remove(), 7000);
        }
      }

      setInterval(() => spawnHearts(1), 900);
    });
  </script>

</body>
</html>
