<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Valentine 💖</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg1: #f8cdda;
      --bg2: #fbd3e9;
      --accent1: #ff758c;
      --accent2: #ff7eb3;
      --text-dark: #333;
      --text-light: #666;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      font-family: "Poppins", sans-serif;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 26px;
      padding: 42px 32px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 30px 70px rgba(0,0,0,0.18);
      animation: slideIn 1.2s ease;
    }

    .heart {
      font-size: 48px;
      margin-bottom: 10px;
      animation: pulse 2s infinite;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: 26px;
      margin: 10px 0;
      color: var(--text-dark);
    }

    p {
      font-size: 16px;
      color: var(--text-light);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .actions {
      position: relative;
      height: 64px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button {
      border: none;
      border-radius: 30px;
      padding: 13px 30px;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    #yesBtn {
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: #fff;
      box-shadow: 0 12px 28px rgba(255, 120, 160, 0.45);
    }

    #yesBtn:hover {
      transform: scale(1.1);
    }

    #noBtn {
      position: absolute;
      right: 10%;
      background: #f2f2f2;
      color: #555;
    }

    .floating-heart {
      position: fixed;
      bottom: -20px;
      font-size: 18px;
      opacity: 0.7;
      animation: floatUp linear forwards;
      pointer-events: none;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }

    @keyframes floatUp {
      from { transform: translateY(0); opacity: 0; }
      20% { opacity: 0.7; }
      to { transform: translateY(-120vh); opacity: 0; }
    }
  </style>
</head>

<body>

  <!-- Music -->
  <audio id="music" loop>
    <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mpeg">
  </audio>

  <div class="card" id="card">
    <div class="heart">💗</div>
    <h1>My Dearest <span id="name">Rupam</span></h1>
    <p>
      Every moment feels softer with you.<br>
      Will you be my Valentine?
    </p>

    <div class="actions">
      <button id="yesBtn">Yes, always 💕</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const yesBtn = document.getElementById("yesBtn");
      const noBtn = document.getElementById("noBtn");
      const card = document.getElementById("card");
      const music = document.getElementById("music");

      // Start music on first interaction (mobile-safe)
      document.body.addEventListener("click", () => {
        music.play().catch(() => {});
      }, { once: true });

      // Move "No" button smoothly
      noBtn.addEventListener("mouseenter", () => {
        const x = Math.random() * 140 - 70;
        const y = Math.random() * 50 - 25;
        noBtn.style.transform = `translate(${x}px, ${y}px)`;
      });

      // Yes button action
      yesBtn.addEventListener("click", () => {
        card.innerHTML = `
          <div class="heart">💖</div>
          <h1>You chose love</h1>
          <p>
            And I promise to choose you,<br>
            every single day.
          </p>
        `;
        spawnHearts(28);
      });

      function spawnHearts(count) {
        for (let i = 0; i < count; i++) {
          const heart = document.createElement("div");
          heart.className = "floating-heart";
          heart.textContent = "💗";
          heart.style.left = Math.random() * 100 + "vw";
          heart.style.animationDuration = 4 + Math.random() * 3 + "s";
          document.body.appendChild(heart);
          setTimeout(() => heart.remove(), 7000);
        }
      }

      setInterval(() => spawnHearts(1), 900);
    });
  </script>

</body>
</html>
