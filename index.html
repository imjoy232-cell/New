<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For Nancy 💖</title>

  <style>
    body {
      font-family: "Comic Sans MS", cursive;
      background: linear-gradient(135deg, #ffb6c1, #ffe4e9);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    .box {
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
      max-width: 320px;
    }

    h1 {
      color: #e6005c;
      margin-bottom: 25px;
      transition: all 0.3s ease;
    }

    button {
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      padding: 12px 22px;
      margin: 10px;
    }

    #yes {
      background: #ff4d88;
      color: white;
    }

    #no {
      background: #ddd;
    }

    .hint {
      font-size: 12px;
      color: #777;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Background Music -->
  <audio autoplay loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <div class="box">
    <h1 id="question">
      Nancy 💖<br>
      Will you be my Valentine?
    </h1>

    <button id="yes" onclick="yesClicked()">Yes 💘</button>
    <button id="no">No 🙈</button>

    <div class="hint">(Try clicking No 😉)</div>
  </div>

  <script>
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const question = document.getElementById("question");

    let yesSize = 16;
    let noSize = 16;
    let clickCount = 0;

    const messages = [
      "Nancy… are you sure? 🥺",
      "That made my heart skip 💔",
      "But I really like you 💕",
      "Please think again 😢",
      "I promise lots of smiles 😊",
      "Okay… now I’m nervous 😭",
      "You know you want to say YES 😏❤️"
    ];

    noBtn.addEventListener("click", () => {
      // YES grows
      yesSize += 6;
      yesBtn.style.fontSize = yesSize + "px";
      yesBtn.style.padding = yesSize + "px";

      // NO shrinks
      noSize -= 2;
      noBtn.style.fontSize = noSize + "px";
      noBtn.style.padding = noSize / 2 + "px";

      // Change message
      question.innerText =
        messages[Math.min(clickCount, messages.length - 1)];

      clickCount++;

      if (noSize <= 6) {
        noBtn.innerText = "😢";
        noBtn.disabled = true;
      }
    });

    function yesClicked() {
      document.body.innerHTML = `
        <h1 style="color:#e6005c">
          Yayyy 💖🥰<br>
          Nancy said YES!<br><br>
          Happy Valentine’s 💐
        </h1>
      `;
    }
  </script>

</body>
</html>
