<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For Nancy 💖</title>

  <style>
    body {
      font-family: "Comic Sans MS", cursive;
      background: linear-gradient(135deg, #ffccd5, #fff0f3);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      text-align: center;
    }

    .box {
      background: white;
      padding: 36px;
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.18);
      max-width: 340px;
      z-index: 2;
    }

    h1 {
      color: #e6005c;
      margin-bottom: 24px;
      transition: all 0.3s ease;
    }

    button {
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      padding: 12px 24px;
      margin: 10px;
      transition: all 0.3s ease;
    }

    #yes {
      background: #ff4d88;
      color: white;
    }

    #no {
      background: #ddd;
    }

    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 10px;
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      bottom: -20px;
      color: #ff5c8a;
      animation: floatUp linear infinite;
      opacity: 0.8;
      pointer-events: none;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      to {
        transform: translateY(-120vh) scale(1.6);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Ultra-soft romantic piano -->
  <audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/audio/2023/03/28/audio_f1e6f0b9e6.mp3" type="audio/mpeg">
  </audio>

  <div class="box">
    <h1 id="question">
      Nancy 💖<br>
      Will you be my Valentine?
    </h1>

    <button id="yes" onclick="yesClicked()">Yes 💘</button>
    <button id="no">No 🙈</button>

    <div class="hint">(Try clicking No 😉)</div>
  </div>

  <script>
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const question = document.getElementById("question");
    const music = document.getElementById("bgMusic");

    let yesSize = 16;
    let noSize = 16;
    let clickCount = 0;
    let musicStarted = false;

    const messages = [
      "Nancy… are you sure? 🥺",
      "That touched my heart 💔",
      "I really like you 💕",
      "Please don’t say no 😢",
      "I promise warmth and smiles 😊",
      "My heart is waiting 😭",
      "You know it’s YES 😏❤️"
    ];

    function playMusic() {
      if (!musicStarted) {
        music.volume = 0.25; // very soft
        music.play().catch(() => {});
        musicStarted = true;
      }
    }

    noBtn.addEventListener("click", () => {
      playMusic();

      yesSize += 6;
      yesBtn.style.fontSize = yesSize + "px";
      yesBtn.style.padding = yesSize + "px";

      noSize -= 2;
      noBtn.style.fontSize = noSize + "px";
      noBtn.style.padding = (noSize / 2) + "px";

      question.innerText =
        messages[Math.min(clickCount, messages.length - 1)];

      clickCount++;

      if (noSize <= 6) {
        noBtn.innerText = "😢";
        noBtn.disabled = true;
      }
    });

    function yesClicked() {
      playMusic();
      document.body.innerHTML = `
        <h1 style="color:#e6005c">
          Yayyy 💖🥰<br>
          Nancy said YES!<br><br>
          — From Rupam 💌
        </h1>
      `;
    }

    // Floating hearts
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerText = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (14 + Math.random() * 18) + "px";
      heart.style.animationDuration = (6 + Math.random() * 4) + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 8000);
    }, 600);
  </script>

</body>
</html>
