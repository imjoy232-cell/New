<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Tuli 💖</title>

  <style>
    :root {
      --pink-main: #ff4d88;
      --pink-dark: #e6005c;
      --pink-light: #ffccd5;
      --pink-soft: #fff0f3;
      --card-bg: #ffffff;
      --text-soft: #555;
    }

    /* ---------- RESET ---------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Comic Sans MS", cursive;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--pink-light), var(--pink-soft));
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      text-align: center;
    }

    /* ---------- CARD ---------- */
    .valentine-card {
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.18);
      max-width: 340px;
      width: 90%;
      z-index: 2;
    }

    .valentine-question {
      color: var(--pink-dark);
      margin-bottom: 1.6rem;
      min-height: 90px;
    }

    /* ---------- BUTTONS ---------- */
    .actions {
      margin-top: 1rem;
    }

    .btn {
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      padding: 12px 24px;
      margin: 10px;
      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        background-color 0.3s ease;
    }

    /* YES button – heartbeat + glow */
    .btn-yes {
      background: var(--pink-main);
      color: #fff;
      animation: heartbeat 1.8s infinite;
      box-shadow: 0 0 0 rgba(255, 77, 136, 0.6);
    }

    .btn-yes:hover {
      box-shadow: 0 0 18px rgba(255, 77, 136, 0.8);
      transform: scale(1.08);
    }

    /* NO button – playful */
    .btn-no {
      background: #ddd;
      color: #333;
    }

    .btn-no.shake {
      animation: shake 0.35s;
    }

    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 10px;
    }

    /* ---------- ANIMATIONS ---------- */
    @keyframes heartbeat {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.12); }
      50%  { transform: scale(1); }
      70%  { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
      75% { transform: translateX(-4px); }
      100% { transform: translateX(0); }
    }

    /* ---------- FLOATING HEARTS ---------- */
    .heart {
      position: fixed;
      bottom: -20px;
      pointer-events: none;
      color: var(--pink-main);
      opacity: 0.8;
      animation: floatUp linear forwards;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      to {
        transform: translateY(-120vh) scale(1.6);
        opacity: 0;
      }
    }

    /* ---------- FINAL MESSAGE ---------- */
    .final-message p {
      margin-top: 15px;
      font-size: 15px;
      color: var(--text-soft);
    }
  </style>
</head>

<body>

  <!-- 🎵 Soft romantic music -->
  <audio id="bgMusic" loop>
    <source
      src="https://cdn.pixabay.com/audio/2023/03/28/audio_f1e6f0b9e6.mp3"
      type="audio/mpeg"
    />
  </audio>

  <main class="valentine-card" id="card">
    <h1 class="valentine-question" id="question">
      Tuli 💖<br />
      Will you be my Valentine?
    </h1>

    <div class="actions">
      <button class="btn btn-yes" id="yesBtn">Yes 💘</button>
      <button class="btn btn-no" id="noBtn">No 🙈</button>
    </div>

    <div class="hint">(Try clicking No 😉)</div>
  </main>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const question = document.getElementById("question");
    const card = document.getElementById("card");
    const music = document.getElementById("bgMusic");

    let yesSize = 16;
    let noSize = 16;
    let index = 0;
    let musicStarted = false;

    const messages = [
      "Tuli… are you sure? 🥺",
      "That kind of hurt 💔",
      "I really like you 💕",
      "Please don’t say no 😢",
      "I promise smiles & warmth 😊",
      "My heart is waiting 😭",
      "You know it’s YES 😏❤️"
    ];

    function playMusicOnce() {
      if (musicStarted) return;
      music.volume = 0.18;
      music.playbackRate = 0.95;
      music.play().catch(() => {});
      musicStarted = true;
    }

    function typeText(el, text, speed = 45) {
      el.textContent = "";
      let i = 0;
      const timer = setInterval(() => {
        el.textContent += text.charAt(i);
        i++;
        if (i >= text.length) clearInterval(timer);
      }, speed);
    }

    noBtn.addEventListener("click", () => {
      playMusicOnce();

      noBtn.classList.remove("shake");
      void noBtn.offsetWidth; // restart animation
      noBtn.classList.add("shake");

      yesSize += 6;
      yesBtn.style.fontSize = yesSize + "px";
      yesBtn.style.padding = yesSize + "px";

      noSize -= 2;
      noBtn.style.fontSize = noSize + "px";
      noBtn.style.padding = (noSize / 2) + "px";

      typeText(question, messages[Math.min(index, messages.length - 1)]);
      index++;

      if (noSize <= 6) {
        noBtn.textContent = "😢";
        noBtn.disabled = true;
      }
    });

    yesBtn.addEventListener("click", () => {
      playMusicOnce();
      card.innerHTML = `
        <div class="final-message">
          <h1 style="color: var(--pink-dark)">
            Yayyy 💖🥰<br />
            Tuli said YES!
          </h1>
          <p>
            I’ve liked you for a while…<br />
            and this was my little brave moment 🙈
          </p>
          <p>— From Rupam 💌</p>
        </div>
      `;
    });

    // Floating hearts
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = 14 + Math.random() * 18 + "px";
      heart.style.animationDuration = 6 + Math.random() * 4 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 8000);
    }, 600);
  </script>

</body>
</html>
