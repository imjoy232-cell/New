<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For Nancy 💖</title>

  <!-- ================== STYLES ================== -->
  <style>
    :root {
      --primary: #ff4d88;
      --secondary: #e6005c;
      --bg-start: #ffccd5;
      --bg-end: #fff0f3;
    }

    body {
      font-family: "Comic Sans MS", cursive;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      text-align: center;
    }

    .card {
      background: #fff;
      padding: 36px;
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.18);
      max-width: 340px;
      z-index: 2;
    }

    h1 {
      color: var(--secondary);
      margin-bottom: 24px;
      transition: all 0.3s ease;
    }

    .actions button {
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      padding: 12px 24px;
      margin: 10px;
      transition: all 0.3s ease;
    }

    #yes {
      background: var(--primary);
      color: #fff;
    }

    #no {
      background: #ddd;
    }

    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 10px;
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      bottom: -20px;
      pointer-events: none;
      color: var(--primary);
      opacity: 0.8;
      animation: floatUp linear forwards;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      to {
        transform: translateY(-120vh) scale(1.6);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <!-- ================== MUSIC ================== -->
  <audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/audio/2023/03/28/audio_f1e6f0b9e6.mp3" type="audio/mpeg">
  </audio>

  <!-- ================== CONTENT ================== -->
  <main class="card">
    <h1 id="question">
      Nancy 💖<br />
      Will you be my Valentine?
    </h1>

    <div class="actions">
      <button id="yes">Yes 💘</button>
      <button id="no">No 🙈</button>
    </div>

    <div class="hint">(Try clicking No 😉)</div>
  </main>

  <!-- ================== SCRIPT ================== -->
  <script>
    /* ---------- CONFIG ---------- */
    const CONFIG = {
      yesGrow: 6,
      noShrink: 2,
      minNoSize: 6,
      heartInterval: 600,
      musicVolume: 0.25
    };

    const MESSAGES = [
      "Nancy… are you sure? 🥺",
      "That touched my heart 💔",
      "I really like you 💕",
      "Please don’t say no 😢",
      "I promise warmth and smiles 😊",
      "My heart is waiting 😭",
      "You know it’s YES 😏❤️"
    ];

    /* ---------- ELEMENTS ---------- */
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const question = document.getElementById("question");
    const music = document.getElementById("bgMusic");

    /* ---------- STATE ---------- */
    let yesSize = 16;
    let noSize = 16;
    let messageIndex = 0;
    let musicStarted = false;

    /* ---------- FUNCTIONS ---------- */
    function playMusicOnce() {
      if (musicStarted) return;
      music.volume = CONFIG.musicVolume;
      music.play().catch(() => {});
      musicStarted = true;
    }

    function handleNoClick() {
      playMusicOnce();

      // Grow YES
      yesSize += CONFIG.yesGrow;
      yesBtn.style.fontSize = yesSize + "px";
      yesBtn.style.padding = yesSize + "px";

      // Shrink NO
      noSize -= CONFIG.noShrink;
      noBtn.style.fontSize = noSize + "px";
      noBtn.style.padding = (noSize / 2) + "px";

      // Update message
      question.innerText = MESSAGES[Math.min(messageIndex, MESSAGES.length - 1)];
      messageIndex++;

      if (noSize <= CONFIG.minNoSize) {
        noBtn.textContent = "😢";
        noBtn.disabled = true;
      }
    }

    function handleYesClick() {
      playMusicOnce();
      document.querySelector(".card").innerHTML = `
        <h1 style="color: var(--secondary)">
          Yayyy 💖🥰<br />
          Nancy said YES!<br /><br />
          — From Rupam 💌
        </h1>
      `;
    }

    function spawnHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = 14 + Math.random() * 18 + "px";
      heart.style.animationDuration = 6 + Math.random() * 4 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 8000);
    }

    /* ---------- EVENTS ---------- */
    noBtn.addEventListener("click", handleNoClick);
    yesBtn.addEventListener("click", handleYesClick);

    /* ---------- HEARTS LOOP ---------- */
    setInterval(spawnHeart, CONFIG.heartInterval);
  </script>

</body>
</html>
